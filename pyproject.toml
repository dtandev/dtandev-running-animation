[project]
name = "dtandev-running-animation"
version = "0.1.0"
description = "Interactive HTML animations of running activities from GPX"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Dariusz Tanajewski" }
]

dependencies = [
    "piexif>=1.1.3",
    "pillow>=10.0",  # EXIF GPS + thumbnails for photo pins
]

[project.urls]
Homepage = "https://dtanajewski.com"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.15.18",  # pinned exactly, matching .pre-commit-config.yaml's rev — keep both in sync
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["src"]
